<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Atlassian event coordination flow</title>
  <desc id="desc">An event brief and decisions in Confluence inform Jira tasks and ownership, while Rovo helps find and summarize approved context.</desc>
  <rect width="960" height="480" rx="24" fill="#111113"/>
  <g fill="#18181b" stroke="#f97316" stroke-width="2">
    <rect x="70" y="165" width="230" height="145" rx="14"/>
    <rect x="365" y="165" width="230" height="145" rx="14"/>
    <rect x="660" y="165" width="230" height="145" rx="14"/>
  </g>
  <g fill="#f4f4f5" font-family="Arial,sans-serif" text-anchor="middle">
    <text x="185" y="210" font-size="20" font-weight="700">CONFLUENCE</text><text x="185" y="245" fill="#a1a1aa" font-size="15">Brief · decisions · runbook</text>
    <text x="480" y="210" font-size="20" font-weight="700">JIRA</text><text x="480" y="245" fill="#a1a1aa" font-size="15">Owners · tasks · dependencies</text>
    <text x="775" y="210" font-size="20" font-weight="700">ROVO AI</text><text x="775" y="245" fill="#a1a1aa" font-size="15">Find · summarize · link sources</text>
  </g>
  <g fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M315 238h34m-15-15 15 15-15 15M610 238h34m-15-15 15 15-15 15"/>
  </g>
  <text x="480" y="92" fill="#f97316" font-family="Arial,sans-serif" font-size="17" letter-spacing="3" text-anchor="middle">SHARED CONTEXT · ACCOUNTABLE EXECUTION · GROUNDED ASSISTANCE</text>
</svg>
